<span class="brand-mark{% if site_logo %} brand-mark-has-logo{% endif %}">
  {% if site_logo %}
    <img src="{% if site_logo_mark and not brand_full_logo %}{{ site_logo_mark }}{% else %}{{ site_logo.url }}{% endif %}" alt="{{ app_name }} logo" class="brand-logo">
  {% else %}
    <i class="bi bi-water"></i>
  {% endif %}
</span>
<span>
  <span class="brand-name d-block">{{ app_name }}</span>
  {% if app_tagline %}<span class="brand-caption">{{ app_tagline }}</span>{% endif %}
</span>
